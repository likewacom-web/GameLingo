name: Build GameLingo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write  # to update the "latest" release with each build

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Thai OCR model for Tesseract; kept out of git and bundled into the APK at build time
      - name: Download Thai Tesseract model
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fsSL -o app/src/main/assets/tessdata/tha.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/tha.traineddata

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLingo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A fixed download link that never expires (artifact links need a GitHub login and signed
      # download URLs only last minutes): every build replaces the APK on the "latest" pre-release.
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GameLingo-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GameLingo-debug.apk --prerelease --target "${{ github.sha }}" \
            --title "GameLingo (latest build)" \
            --notes "Debug APK built from ${{ github.ref_name }} at ${{ github.sha }}. Install over the previous version."
